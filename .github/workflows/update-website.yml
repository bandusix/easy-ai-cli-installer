name: update-website-versions

# Update CLI version numbers on the landing page daily
on:
  schedule:
    - cron: '30 4 * * *'  # 04:30 UTC daily (30 min after build workflow)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-versions:
    name: Update CLI versions on website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest CLI versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_latest.py --check --platform clis
          # The script outputs to stdout, capture it
          python scripts/fetch_latest.py --check --platform clis > /tmp/versions.txt 2>&1 || true
          cat /tmp/versions.txt

      - name: Extract versions and update index.html
        run: |
          # Parse versions from fetch_latest output
          CLAUDE=$(grep -oP 'claude-code.*latest=\K[v0-9.]+' /tmp/versions.txt || echo "v2.1.221")
          CODEX=$(grep -oP 'codex.*latest=\K[a-z0-9.-]+' /tmp/versions.txt || echo "rust-v0.146.0")
          GEMINI=$(grep -oP 'gemini.*latest=\K[v0-9.]+' /tmp/versions.txt || echo "v0.53.1")
          KIMI=$(grep -oP 'kimi.*latest=\K[v0-9.]+' /tmp/versions.txt || echo "v0.31.1")
          LARK=$(grep -oP 'lark.*latest=\K[v0-9.]+' /tmp/versions.txt || echo "v1.0.82")

          echo "Detected versions:"
          echo "  Claude Code: $CLAUDE"
          echo "  Codex: $CODEX"
          echo "  Gemini: $GEMINI"
          echo "  Kimi: $KIMI"
          echo "  Lark: $LARK"

          # Update index.html with sed (match version markers)
          sed -i "s|<div class=\"tool-version\" data-version=\"claude\">[^<]*</div><!-- claude -->|<div class=\"tool-version\" data-version=\"claude\">$CLAUDE</div><!-- claude -->|" index.html
          sed -i "s|<div class=\"tool-version\" data-version=\"codex\">[^<]*</div><!-- codex -->|<div class=\"tool-version\" data-version=\"codex\">$CODEX</div><!-- codex -->|" index.html
          sed -i "s|<div class=\"tool-version\" data-version=\"gemini\">[^<]*</div><!-- gemini -->|<div class=\"tool-version\" data-version=\"gemini\">$GEMINI</div><!-- gemini -->|" index.html
          sed -i "s|<div class=\"tool-version\" data-version=\"kimi\">[^<]*</div><!-- kimi -->|<div class=\"tool-version\" data-version=\"kimi\">$KIMI</div><!-- kimi -->|" index.html
          sed -i "s|<div class=\"tool-version\" data-version=\"lark\">[^<]*</div><!-- lark -->|<div class=\"tool-version\" data-version=\"lark\">$LARK</div><!-- lark -->|" index.html

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update CLI versions on landing page

Auto-updated by update-website-versions workflow.
Run: ${{ github.run_id }}"
          git push

      - name: No changes
        if: steps.check.outputs.changed == 'false'
        run: echo "No version changes detected, skipping commit."