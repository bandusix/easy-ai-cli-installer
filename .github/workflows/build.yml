name: build-installer

# Triggers:
#   - schedule: every day at 04:00 UTC. Re-runs the version check; if any of
#     the 5 CLIs has shipped a new release, the build jobs fire and a new
#     GitHub release is cut.
#   - workflow_dispatch: manual trigger from the Actions tab. Always builds.
#   - push: rebuild whenever the Python source or this workflow changes,
#     even if no upstream CLI has a new release — useful for shipping a UI
#     tweak to the offline installer.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'gui_installer.py'
      - 'build.spec'
      - 'scripts/fetch_latest.py'
      - '.github/workflows/build.yml'

# Read-only by default; release job escalates to write to create releases.
permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------------
  # 1. Detect CLI updates. Pure inspection, no downloads. Runs on Linux
  #    so we don't waste a Windows/macOS runner on what is essentially
  #    a metadata call.
  # -----------------------------------------------------------------------
  detect-updates:
    name: Detect CLI updates
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      updated: ${{ steps.check.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: check
        run: python scripts/fetch_latest.py --check --platform clis
      - name: Summary
        run: |
          echo "needs_update=${{ steps.check.outputs.needs_update }}"
          echo "updated=${{ steps.check.outputs.updated }}"

  # -----------------------------------------------------------------------
  # 2. Build the Windows installer.
  #    Gates on: any CLI update OR a source push OR a manual run.
  # -----------------------------------------------------------------------
  build-windows:
    name: Build Windows .exe
    needs: detect-updates
    if: |
      needs.detect-updates.outputs.needs_update == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download latest CLI payloads (Windows)
        run: python scripts/fetch_latest.py --download --platform windows
      - name: Install PyInstaller
        run: pip install pyinstaller==6.*
      - name: Build with PyInstaller
        run: pyinstaller build.spec --clean
      - name: Rename artifact
        shell: pwsh
        run: |
          mv dist/AI_Tools_Installer.exe dist/AI_Tools_Installer_Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AI_Tools_Installer_Windows
          path: dist/AI_Tools_Installer_Windows.exe

  # -----------------------------------------------------------------------
  # 3. Build the macOS (Apple Silicon) installer.
  #    GitHub-hosted macOS runners have limited disk space (~14GB usable).
  #    We aggressively clean system files before building, then use hdiutil
  #    with a sparse image to minimize peak disk usage during .dmg creation.
  # -----------------------------------------------------------------------
  build-macos-arm:
    name: Build macOS arm64 .dmg
    needs: detect-updates
    if: |
      needs.detect-updates.outputs.needs_update == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free up disk space (aggressive cleanup)
        run: |
          echo "Before cleanup:"
          df -h / | tail -1
          # Remove Xcode (largest consumer, ~20GB)
          sudo rm -rf /Applications/Xcode*.app || true
          # Remove simulators and device support files
          sudo rm -rf /Library/Developer/CoreSimulator || true
          sudo rm -rf ~/Library/Developer/CoreSimulator || true
          # Remove DerivedData and caches
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          sudo rm -rf ~/Library/Caches/* || true
          sudo rm -rf /Users/runner/Library/Caches/* || true
          # Remove Homebrew (we don't need it, saves ~3GB)
          sudo rm -rf /opt/homebrew || true
          sudo rm -rf /usr/local/Homebrew || true
          # Remove Android SDK if present
          sudo rm -rf /Users/runner/Library/Android || true
          sudo rm -rf ~/Library/Android || true
          # Remove .NET and other runtimes we don't use
          sudo rm -rf /usr/local/share/dotnet || true
          sudo rm -rf /Library/Frameworks/Mono.framework || true
          echo "After cleanup:"
          df -h / | tail -1
      - name: Download latest CLI payloads (macOS arm64)
        run: python scripts/fetch_latest.py --download --platform macos-arm
      - name: Install PyInstaller
        run: pip install pyinstaller==6.*
      - name: Build with PyInstaller
        run: pyinstaller build.spec --clean
      - name: Create .dmg with sparse image (lower disk usage)
        run: |
          # Use UDRW (read-write, uncompressed) format first to avoid
          # the compression overhead, then convert to UDZO at the end.
          # This uses less peak disk space than directly creating UDZO.
          hdiutil create -volname "AI Tools Installer" \
            -srcfolder dist/AI_Tools_Installer.app \
            -ov -format UDRW \
            temp.dmg
          # Convert to compressed format
          hdiutil convert temp.dmg -format UDZO \
            -o dist/AI_Tools_Installer_macOS_arm64.dmg
          rm temp.dmg
          ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AI_Tools_Installer_macOS_arm64
          path: dist/AI_Tools_Installer_macOS_arm64.dmg

  # -----------------------------------------------------------------------
  # 4. Cut a GitHub release with both artifacts. Skipped if any build
  #    failed.
  # -----------------------------------------------------------------------
  release:
    name: Cut GitHub Release
    needs: [build-windows, build-macos-arm]
    if: success() && (needs.detect-updates.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-${{ github.run_number }}-${{ github.event.repository.name }}
          name: AI Tools Installer — ${{ github.event.head_commit.timestamp || github.run_started_at }}
          body: |
            Auto-built by the [build-installer workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            **Updated tools in this build:**
            ${{ needs.detect-updates.outputs.updated }}

            **Artifacts:**
            - `AI_Tools_Installer_Windows.exe` — Windows x64 (double-click to run)
            - `AI_Tools_Installer_macOS_arm64.dmg` — macOS Apple Silicon (double-click to mount, drag to Applications)
          files: |
            artifacts/AI_Tools_Installer_Windows/AI_Tools_Installer_Windows.exe
            artifacts/AI_Tools_Installer_macOS_arm64/AI_Tools_Installer_macOS_arm64.dmg
          fail_on_unmatched_files: false
          generate_release_notes: true